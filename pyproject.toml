[project]
name = "ai-mt5-multimodel-bot"
version = "0.1.0"
description = "AI MT5 Multi-Model Trading System (dry_run skeleton, baseline forecast, risk gate)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6,<3",
    "PyYAML>=6.0,<7",
    "structlog>=24.1,<26",
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "click>=8.1,<9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<7",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
    "hypothesis>=6.100,<7",
    "types-PyYAML",
]

[project.scripts]
ai-mt5 = "ai_mt5.cli:cli"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_mt5"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501", # line length handled by formatter
    "B008", # function call in default arg (FastAPI/Click idioms)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "N803"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pkg_resources.*",
]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
packages = ["ai_mt5"]
mypy_path = "src"

[tool.coverage.run]
source = ["src/ai_mt5"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
